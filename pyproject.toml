[project]
name = "vent"
version = "1.0.0"
description = "CLI to write Steam appIDs into .steam files for an ES-DE ROM library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.8",
    "requests>=2.32",
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
]

[project.scripts]
vent = "vent.cli:app"

[project.optional-dependencies]
keyring = ["keyring>=25.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vent"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
